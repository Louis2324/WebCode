name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate package metadata
        shell: bash
        run: |
          node --input-type=commonjs -e "const fs=require('fs'); const packageJson=JSON.parse(fs.readFileSync('package.json','utf8')); if (!packageJson.name || !packageJson.version || !packageJson.main) process.exit(1);"

      - name: Check JavaScript syntax
        run: |
          node --check main.js
          node --check preload.js
          node --check menu.js
          node --check dist/script.js

      - name: Run tests when available
        run: npm run test --if-present

      - name: Build an unpacked Electron bundle
        run: npx electron-builder --linux dir --publish never

      - name: Verify unpacked bundle
        shell: bash
        run: test -f release/linux-unpacked/web-code
